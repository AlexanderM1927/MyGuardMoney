server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.html;
    server_tokens off;
    # The host terminates HTTPS; keep redirects relative to the public origin.
    absolute_redirect off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /v1 {
        return 308 /v1/$is_args$args;
    }

    # Lumen registers /v1 routes itself, so preserve the original REQUEST_URI.
    location /v1/ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/v1/index.php;
        # Prevent Symfony from stripping /v1 from the application's route.
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_PROXY "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
